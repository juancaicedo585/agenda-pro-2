<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pro — Juan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f5f3;--bg-info:#e6f1fb;
  --text-primary:#1a1a18;--text-secondary:#5f5e5a;--text-tertiary:#888780;--text-info:#185fa5;
  --border-light:rgba(0,0,0,0.12);--border-mid:rgba(0,0,0,0.22);
  --radius-md:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#1e1e1c;--bg-secondary:#2a2a28;--bg-info:#0c2a47;
  --text-primary:#f0efea;--text-secondary:#a0a09a;--text-tertiary:#666662;--text-info:#7ab8f0;
  --border-light:rgba(255,255,255,0.10);--border-mid:rgba(255,255,255,0.18);
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-secondary);color:var(--text-primary);min-height:100vh}
.app{max-width:1100px;margin:0 auto;background:var(--bg-primary);min-height:100vh;display:flex;flex-direction:column;border-left:0.5px solid var(--border-light);border-right:0.5px solid var(--border-light)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:0.5px solid var(--border-light);flex-wrap:wrap;gap:8px}
.topbar-left{display:flex;align-items:center;gap:10px}
.day-nav{display:flex;align-items:center;gap:6px}
.nav-btn{background:transparent;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);padding:4px 10px;cursor:pointer;font-size:13px;color:var(--text-primary)}
.nav-btn:hover{background:var(--bg-secondary)}
.today-label{font-size:15px;font-weight:500;color:var(--text-primary);min-width:220px;text-align:center}
.topbar-right{display:flex;gap:8px;flex-wrap:wrap}
.btn-gcal{background:transparent;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);padding:5px 12px;cursor:pointer;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.btn-gcal:hover{background:var(--bg-secondary);color:var(--text-primary)}
.btn-add{background:var(--bg-info);color:var(--text-info);border:none;border-radius:var(--radius-md);padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500}
.btn-add:hover{opacity:0.85}
.main{display:grid;grid-template-columns:1fr 280px;flex:1}
@media(max-width:700px){.main{grid-template-columns:1fr}}
.timeline{border-right:0.5px solid var(--border-light);overflow-y:auto}
.hour-row{display:flex;align-items:flex-start;border-bottom:0.5px solid var(--border-light);min-height:56px;position:relative}
.hour-label{width:52px;padding:8px 8px 0 12px;font-size:12px;color:var(--text-tertiary);flex-shrink:0}
.hour-content{flex:1;padding:4px 8px;position:relative}
.event-block{border-radius:var(--radius-md);padding:6px 10px;margin-bottom:3px;cursor:pointer;transition:opacity 0.15s}
.event-block:hover{opacity:0.8}
.event-block.local{background:#EAF3DE;border-left:3px solid #639922;color:#27500A}
.ev-title{font-size:13px;font-weight:500}
.ev-time{font-size:11px;opacity:0.7;margin-top:1px}
.now-line{position:absolute;left:52px;right:0;height:1.5px;background:#E24B4A;z-index:10;pointer-events:none}
.now-dot{position:absolute;left:-6px;width:7px;height:7px;border-radius:50%;background:#E24B4A;top:-3px}
.sidebar{display:flex;flex-direction:column}
.sidebar-section{border-bottom:0.5px solid var(--border-light);padding:1rem}
.s-title{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.s-title button{background:transparent;border:none;cursor:pointer;font-size:20px;color:var(--text-secondary);line-height:1;padding:0}
.s-title button:hover{color:var(--text-primary)}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border-light)}
.task-item:last-child{border-bottom:none}
.task-check{width:16px;height:16px;border:0.5px solid var(--border-mid);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--bg-primary);font-size:10px;color:white}
.task-check.done{background:#639922;border-color:#639922}
.task-text{flex:1;font-size:13px;color:var(--text-primary);line-height:1.4}
.task-text.done{text-decoration:line-through;color:var(--text-tertiary)}
.badge{font-size:10px;padding:2px 6px;border-radius:var(--radius-md);flex-shrink:0;font-weight:500;margin-top:2px}
.p-alta{background:#FCEBEB;color:#A32D2D}
.p-media{background:#FAEEDA;color:#854F0B}
.p-baja{background:#EAF3DE;color:#3B6D11}
.note-item{font-size:12px;color:var(--text-secondary);padding:6px 8px;background:var(--bg-secondary);border-radius:var(--radius-md);margin-bottom:6px;cursor:pointer;line-height:1.4}
.note-item:hover{background:var(--bg-primary);border:0.5px solid var(--border-mid)}
.btn-note-add{font-size:12px;color:var(--text-secondary);background:transparent;border:none;cursor:pointer;padding:2px 0;margin-top:2px}
.btn-note-add:hover{color:var(--text-primary)}
.gcal-note{font-size:11px;color:var(--text-tertiary);margin-top:8px;line-height:1.5;background:var(--bg-secondary);padding:8px;border-radius:var(--radius-md)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;z-index:100}
.modal-card{background:var(--bg-primary);border:0.5px solid var(--border-mid);border-radius:var(--radius-lg);padding:1.25rem;min-width:290px;max-width:360px;width:90%}
.modal-card h3{font-size:15px;font-weight:500;margin-bottom:14px}
.modal-card label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:3px;margin-top:10px}
.modal-card input,.modal-card select,.modal-card textarea{width:100%;font-size:13px;padding:6px 9px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-family:inherit}
.modal-card textarea{resize:vertical;min-height:70px}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-btns button{font-size:13px;padding:6px 14px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);cursor:pointer;background:transparent;color:var(--text-primary);font-family:inherit}
.modal-btns button:hover{background:var(--bg-secondary)}
.modal-btns .btn-primary{background:var(--bg-info);color:var(--text-info);border-color:transparent}
.btn-delete{color:#A32D2D !important}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="day-nav">
        <button class="nav-btn" onclick="changeDay(-1)">&#8592;</button>
        <div class="today-label" id="day-label"></div>
        <button class="nav-btn" onclick="changeDay(1)">&#8594;</button>
      </div>
      <button class="nav-btn" style="font-size:12px;color:var(--text-secondary)" onclick="changeDay(0)">hoy</button>
    </div>
    <div class="topbar-right">
      <button class="btn-gcal" onclick="alert('Para sincronizar Google Calendar abre esta agenda desde claude.ai o súbela a GitHub Pages.')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Sincronizar Google Calendar
      </button>
      <button class="btn-add" onclick="openEventModal()">+ Evento</button>
    </div>
  </div>
  <div class="main">
    <div class="timeline" id="timeline"></div>
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="s-title">pendientes <button onclick="openTaskModal()">+</button></div>
        <div id="tasks-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="s-title">notas rápidas <button onclick="openNoteModal()">+</button></div>
        <div id="notes-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="gcal-note">💡 Para sincronizar con Google Calendar, sube este archivo a GitHub Pages o úsalo desde claude.ai.</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"></div>

<script>
const SK='agenda_pro_juan_v1';
let currentDate=new Date();
let evId=20,taskId=20,noteId=20;
let appData=load();

function load(){
  try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){}
  const today=fmtDate(new Date());
  return{
    events:[
      {id:1,title:'Daily standup',start:'09:00',end:'09:30',date:today,source:'local'},
      {id:2,title:'Revisión integración Pancake',start:'11:00',end:'12:00',date:today,source:'local'},
      {id:3,title:'Reunión infraestructura',start:'15:00',end:'16:00',date:today,source:'local'},
    ],
    tasks:[
      {id:1,text:'Revisar endpoints Paraguay',done:false,priority:'alta'},
      {id:2,text:'Documentar API cotizador Ecuador',done:false,priority:'media'},
      {id:3,text:'Actualizar script dropi-remote',done:true,priority:'baja'},
      {id:4,text:'Preparar informe cartera marzo',done:false,priority:'alta'},
    ],
    notes:[
      {id:1,text:'Recordar: base URL correcta Paraguay = /api/v2'},
      {id:2,text:'WhatsApp bot — revisar token Twilio'},
    ]
  };
}

function save(){try{localStorage.setItem(SK,JSON.stringify(appData));}catch(e){}}
function fmtDate(d){return d.toISOString().split('T')[0]}
function parseTime(t){const[h,m]=t.split(':').map(Number);return h*60+m}

function changeDay(dir){
  if(dir===0)currentDate=new Date();
  else{currentDate=new Date(currentDate);currentDate.setDate(currentDate.getDate()+dir);}
  renderAll();
}

function renderAll(){renderLabel();renderTimeline();renderTasks();renderNotes();}

function renderLabel(){
  const isToday=fmtDate(currentDate)===fmtDate(new Date());
  const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('day-label').textContent=
    (isToday?'hoy — ':'')+days[currentDate.getDay()]+' '+currentDate.getDate()+' de '+months[currentDate.getMonth()]+' '+currentDate.getFullYear();
}

function renderTimeline(){
  const tl=document.getElementById('timeline');
  const ds=fmtDate(currentDate);
  const evs=appData.events.filter(e=>e.date===ds);
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const isToday=fmtDate(currentDate)===fmtDate(now);
  let html='';
  for(let h=6;h<=22;h++){
    const hs=h*60,he=(h+1)*60;
    let evHtml=evs.filter(e=>parseTime(e.start)>=hs&&parseTime(e.start)<he).map(e=>`
      <div class="event-block local" onclick="editEvent(${e.id})">
        <div class="ev-title">${e.title}</div>
        <div class="ev-time">${e.start}${e.end?' — '+e.end:''}</div>
      </div>`).join('');
    const pct=isToday&&nm>=hs&&nm<he?((nm-hs)/60*56)+8:null;
    const nl=pct!==null?`<div class="now-line" style="top:${pct}px"><div class="now-dot"></div></div>`:'';
    html+=`<div class="hour-row"><div class="hour-label">${String(h).padStart(2,'0')}:00</div><div class="hour-content">${nl}${evHtml}</div></div>`;
  }
  tl.innerHTML=html;
  if(isToday){const rows=tl.querySelectorAll('.hour-row');const i=Math.max(0,now.getHours()-6);if(rows[i])rows[i].scrollIntoView({block:'center'});}
}

function renderTasks(){
  const order={alta:0,media:1,baja:2};
  const sorted=[...appData.tasks].sort((a,b)=>order[a.priority]-order[b.priority]);
  document.getElementById('tasks-list').innerHTML=sorted.map(t=>`
    <div class="task-item">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</div>
      <div class="task-text ${t.done?'done':''}">${t.text}</div>
      <span class="badge p-${t.priority}">${t.priority}</span>
    </div>`).join('');
}

function renderNotes(){
  document.getElementById('notes-list').innerHTML=
    appData.notes.map(n=>`<div class="note-item" onclick="openNoteModal(${n.id})">${n.text}</div>`).join('')+
    '<button class="btn-note-add" onclick="openNoteModal()">+ nota rápida</button>';
}

function toggleTask(id){const t=appData.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();renderTasks();}}

function showModal(html){const ov=document.getElementById('overlay');ov.innerHTML=`<div class="modal-card">${html}</div>`;ov.style.display='flex';}
function closeModal(){document.getElementById('overlay').style.display='none';}

function openEventModal(ev){
  const e=ev||{};const isEdit=!!e.id;
  showModal(`<h3>${isEdit?'editar evento':'nuevo evento'}</h3>
    <label>título</label><input id="m-t" value="${e.title||''}" placeholder="Reunión...">
    <label>fecha</label><input id="m-d" type="date" value="${e.date||fmtDate(currentDate)}">
    <label>inicio</label><input id="m-s" type="time" value="${e.start||'09:00'}">
    <label>fin</label><input id="m-e" type="time" value="${e.end||'10:00'}">
    <div class="modal-btns">
      ${isEdit?`<button class="btn-delete" onclick="deleteEvent(${e.id})">eliminar</button>`:''}
      <button onclick="closeModal()">cancelar</button>
      <button class="btn-primary" onclick="saveEvent(${isEdit?e.id:'null'})">guardar</button>
    </div>`);
}

function saveEvent(id){
  const t=document.getElementById('m-t').value.trim(),d=document.getElementById('m-d').value,s=document.getElementById('m-s').value,en=document.getElementById('m-e').value;
  if(!t||!d||!s)return;
  if(id&&id!=='null'){const ev=appData.events.find(e=>e.id===id);if(ev){ev.title=t;ev.date=d;ev.start=s;ev.end=en;}}
  else appData.events.push({id:++evId,title:t,date:d,start:s,end:en,source:'local'});
  save();closeModal();renderTimeline();
}

function editEvent(id){const ev=appData.events.find(e=>e.id===id);if(ev)openEventModal(ev);}
function deleteEvent(id){appData.events=appData.events.filter(e=>e.id!==id);save();closeModal();renderTimeline();}

function openTaskModal(){
  showModal(`<h3>nueva tarea</h3>
    <label>tarea</label><input id="tt" placeholder="Descripción...">
    <label>prioridad</label>
    <select id="tp"><option value="alta">alta</option><option value="media" selected>media</option><option value="baja">baja</option></select>
    <div class="modal-btns">
      <button onclick="closeModal()">cancelar</button>
      <button class="btn-primary" onclick="saveTask()">agregar</button>
    </div>`);
}

function saveTask(){
  const t=document.getElementById('tt').value.trim(),p=document.getElementById('tp').value;
  if(!t)return;
  appData.tasks.push({id:++taskId,text:t,done:false,priority:p});
  save();closeModal();renderTasks();
}

function openNoteModal(id){
  const n=id?appData.notes.find(x=>x.id===id):null;
  showModal(`<h3>${n?'editar nota':'nota rápida'}</h3>
    <label>nota</label><textarea id="nt">${n?n.text:''}</textarea>
    <div class="modal-btns">
      ${n?`<button class="btn-delete" onclick="deleteNote(${id})">eliminar</button>`:''}
      <button onclick="closeModal()">cancelar</button>
      <button class="btn-primary" onclick="saveNote(${n?id:'null'})">guardar</button>
    </div>`);
}

function saveNote(id){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  if(id&&id!=='null'){const n=appData.notes.find(x=>x.id===id);if(n)n.text=t;}
  else appData.notes.push({id:++noteId,text:t});
  save();closeModal();renderNotes();
}

function deleteNote(id){appData.notes=appData.notes.filter(n=>n.id!==id);save();closeModal();renderNotes();}

renderAll();
</script>
</body>
</html>

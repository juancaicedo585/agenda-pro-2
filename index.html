<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pro — Juan</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --d1:#17171a;--d2:#1e1e23;--d3:#26262d;--d4:#32323b;
  --t0:#f0eff5;--t1:#b8b7c4;--t2:#7a7988;--t3:#4a4958;
  --acc:#7f77dd;--red:#e24b4a;--green:#639922;--amber:#ba7517;
  --r8:8px;--r12:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f11;color:var(--t0);height:100vh;overflow:hidden;display:block}
.app{width:100%;height:100vh;background:var(--d1);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--d2);border-bottom:0.5px solid var(--d4);flex-wrap:wrap;gap:8px}
.day-nav{display:flex;align-items:center;gap:8px}
.nbtn{background:var(--d3);border:0.5px solid var(--d4);border-radius:var(--r8);padding:4px 10px;cursor:pointer;font-size:13px;color:var(--t1);transition:background 0.15s}
.nbtn:hover{background:var(--d4);color:var(--t0)}
.dlabel{font-size:14px;font-weight:500;color:var(--t0);min-width:210px;text-align:center}
.tbtn{background:var(--acc);border:none;border-radius:var(--r8);padding:5px 14px;cursor:pointer;font-size:13px;color:#fff;font-weight:500;transition:opacity 0.15s}
.tbtn:hover{opacity:0.85}
.tbtn.sec{background:var(--d3);color:var(--t1);border:0.5px solid var(--d4)}
.tbtn.sec:hover{background:var(--d4);color:var(--t0)}
.tbtn:disabled{opacity:0.5;cursor:default}
.main{display:grid;grid-template-columns:1fr 300px;flex:1;min-height:0}
@media(max-width:700px){.main{grid-template-columns:1fr}}
.timeline{border-right:0.5px solid var(--d4);overflow-y:auto;flex:1;min-height:0}
.hrow{display:flex;align-items:flex-start;border-bottom:0.5px solid var(--d3);min-height:56px;position:relative}
.hlbl{width:50px;padding:8px 6px 0 10px;font-size:11px;color:var(--t3);flex-shrink:0}
.hcnt{flex:1;padding:4px 8px;position:relative}
.ev{border-radius:var(--r8);padding:6px 10px;margin-bottom:3px;cursor:pointer;transition:transform 0.15s;border-left:3px solid transparent}
.ev:hover{transform:translateX(2px)}
.ev.local{background:#1a2a14;border-left-color:#639922;color:#97c459}
.ev.gcal{background:#0d1e35;border-left-color:#378add;color:#85b7eb}
.ev-t{font-size:13px;font-weight:500}
.ev-s{font-size:11px;opacity:0.6;margin-top:1px}
.now-line{position:absolute;left:50px;right:0;height:1.5px;background:var(--red);z-index:10;pointer-events:none}
.now-dot{position:absolute;left:-5px;width:7px;height:7px;border-radius:50%;background:var(--red);top:-3px}
.sidebar{display:flex;flex-direction:column;background:var(--d2);overflow-y:auto;min-height:0}
.ssec{border-bottom:0.5px solid var(--d4);padding:14px}
.stitle{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:0.9px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sadd{background:transparent;border:none;cursor:pointer;font-size:20px;color:var(--t2);line-height:1;padding:0}
.sadd:hover{color:var(--t0)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--d3);border-radius:var(--r8);padding:8px 10px;text-align:center}
.stat-n{font-size:20px;font-weight:500;line-height:1}
.stat-l{font-size:10px;color:var(--t2);margin-top:2px}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--d3);transition:opacity 0.35s,transform 0.35s}
.task-item:last-child{border-bottom:none}
.task-item.out{opacity:0;transform:translateX(12px)}
.chk{width:16px;height:16px;border:0.5px solid var(--d4);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--d3);font-size:10px;color:#fff;transition:background 0.2s}
.chk.done{background:var(--green);border-color:var(--green)}
.ttxt{flex:1;font-size:13px;color:var(--t0);line-height:1.4}
.ttxt.done{text-decoration:line-through;color:var(--t3)}
.pbadge{font-size:10px;padding:2px 7px;border-radius:20px;flex-shrink:0;font-weight:500;margin-top:2px}
.p-alta{background:rgba(226,75,74,0.2);color:#f09595}
.p-media{background:rgba(186,117,23,0.2);color:#fac775}
.p-baja{background:rgba(99,153,34,0.2);color:#c0dd97}
.done-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;cursor:pointer;user-select:none}
.done-header-left{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.done-arrow{transition:transform 0.25s;font-size:11px;color:var(--t3)}
.done-arrow.open{transform:rotate(180deg)}
.done-body{overflow:hidden;max-height:0;transition:max-height 0.35s ease}
.done-body.open{max-height:500px}
.postits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pit{border-radius:var(--r8);padding:10px;font-size:12px;line-height:1.5;cursor:pointer;position:relative;transition:transform 0.15s;min-height:68px;word-break:break-word}
.pit:hover{transform:scale(1.02)}
.pit.y{background:#2a2410;color:#fac775;border:0.5px solid #3a3218}
.pit.g{background:#152410;color:#c0dd97;border:0.5px solid #1e3518}
.pit.b{background:#0d1e35;color:#85b7eb;border:0.5px solid #122845}
.pit.p{background:#1e1535;color:#afa9ec;border:0.5px solid #2a1e4a}
.pit-x{position:absolute;top:4px;right:6px;background:transparent;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:0.4;line-height:1;padding:0}
.pit-x:hover{opacity:1}
.gcal-bar{padding:12px 14px;background:var(--d2);border-bottom:0.5px solid var(--d4);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gcal-bar-info{flex:1;font-size:12px;color:var(--t2)}
.gcal-bar-info strong{color:var(--t0);font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;z-index:200}
.overlay.show{display:flex}
.modal{background:var(--d2);border:0.5px solid var(--d4);border-radius:var(--r12);padding:20px;min-width:280px;max-width:360px;width:90%}
.modal h3{font-size:15px;font-weight:500;margin-bottom:14px;color:var(--t0)}
.modal label{font-size:12px;color:var(--t2);display:block;margin-bottom:3px;margin-top:10px}
.modal input,.modal select,.modal textarea{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--d4);border-radius:var(--r8);background:var(--d3);color:var(--t0);font-family:inherit;-webkit-appearance:none;appearance:none}
.modal input::placeholder{color:var(--t3)}
.modal select option{background:var(--d2);color:var(--t0)}
.modal textarea{resize:vertical;min-height:70px}
.mbtns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.mbtns button{font-size:13px;padding:6px 14px;border:0.5px solid var(--d4);border-radius:var(--r8);cursor:pointer;background:var(--d3);color:var(--t1);font-family:inherit;transition:background 0.15s}
.mbtns button:hover{background:var(--d4);color:var(--t0)}
.mpri{background:var(--acc) !important;color:#fff !important;border-color:transparent !important}
.mpri:hover{opacity:0.85}
.mdel{color:#f09595 !important}
.crow{display:flex;gap:8px;margin-top:8px}
.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s}
.cdot:hover{transform:scale(1.2)}
.cdot.sel{border-color:var(--t0)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--d3);color:var(--t0);padding:8px 18px;border-radius:var(--r8);font-size:13px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;border:0.5px solid var(--d4)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="day-nav">
      <button class="nbtn" onclick="chDay(-1)">&#8592;</button>
      <div class="dlabel" id="dlabel"></div>
      <button class="nbtn" onclick="chDay(1)">&#8594;</button>
      <button class="nbtn" style="font-size:11px;color:var(--t2)" onclick="chDay(0)">hoy</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="auth-area"></div>
      <button class="tbtn" onclick="openEvModal()">+ evento</button>
    </div>
  </div>

  <div id="gcal-bar-area"></div>

  <div class="main">
    <div class="timeline" id="timeline"></div>
    <div class="sidebar">
      <div class="ssec">
        <div class="stats-row" id="stats"></div>
        <div class="stitle">pendientes <button class="sadd" onclick="openTaskModal()">+</button></div>
        <div id="tasks-active"></div>
        <div class="done-header" onclick="toggleDone()">
          <div class="done-header-left">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 12 4 9"/><polyline points="4 9 9 18 20 6"/></svg>
            <span id="done-lbl">finalizadas (0)</span>
          </div>
          <span class="done-arrow" id="done-arrow">&#9660;</span>
        </div>
        <div class="done-body" id="done-body">
          <div id="tasks-done" style="padding-top:4px"></div>
        </div>
      </div>
      <div class="ssec">
        <div class="stitle">notas post-it <button class="sadd" onclick="openNoteModal()">+</button></div>
        <div class="postits" id="postits"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID='1078886552266-8aspsk4ngu9bgnlnsqc1ljlcgsak5c6i.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/calendar';
const SK='agenda_pro_v3';

let cur=new Date(),evId=20,tId=20,nId=20,doneOpen=false,selC='y';
let tokenClient=null,accessToken=null,gcalEvs=[],userInfo=null;

let D=loadData();

function loadData(){
  try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){}
  const today=fd(new Date());
  return{
    events:[
      {id:1,title:'Daily standup',start:'09:00',end:'09:30',date:today,src:'local'},
      {id:2,title:'Revisión integración Pancake',start:'11:00',end:'12:00',date:today,src:'local'},
      {id:3,title:'Reunión infraestructura',start:'15:00',end:'16:00',date:today,src:'local'},
    ],
    tasks:[
      {id:1,text:'Revisar endpoints Paraguay',done:false,pri:'alta'},
      {id:2,text:'Documentar API cotizador Ecuador',done:false,pri:'media'},
      {id:3,text:'Actualizar script dropi-remote',done:false,pri:'baja'},
      {id:4,text:'Preparar informe cartera marzo',done:false,pri:'alta'},
    ],
    notes:[
      {id:1,text:'Base URL Paraguay = /api/v2',color:'y'},
      {id:2,text:'WhatsApp bot — revisar token Twilio',color:'g'},
    ]
  };
}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function fd(d){return d.toISOString().split('T')[0]}
function pt(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function initGoogleAuth(){
  if(!window.google)return setTimeout(initGoogleAuth,500);
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,
    callback:(resp)=>{
      if(resp.error)return;
      accessToken=resp.access_token;
      fetchUserInfo();
      loadGcalEvents();
    }
  });
  renderAuthArea();
}

function renderAuthArea(){
  const area=document.getElementById('auth-area');
  if(accessToken){
    const initials=userInfo?userInfo.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase():'JC';
    area.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px">
        <div class="avatar">${initials}</div>
        <span style="font-size:12px;color:var(--t2)">${userInfo?userInfo.name:'Conectado'}</span>
        <button class="nbtn" style="font-size:11px" onclick="signOut()">salir</button>
      </div>`;
    renderGcalBar(true);
  }else{
    area.innerHTML=`<button class="tbtn sec" onclick="signIn()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Conectar Google Calendar
    </button>`;
    renderGcalBar(false);
  }
}

function renderGcalBar(connected){
  const bar=document.getElementById('gcal-bar-area');
  if(connected){
    bar.innerHTML=`<div class="gcal-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c0dd97" stroke-width="2"><polyline points="20 6 9 12 4 9"/><polyline points="4 9 9 18 20 6"/></svg>
      <div class="gcal-bar-info">Google Calendar conectado — <strong>${gcalEvs.length}</strong> evento(s) cargados para hoy</div>
      <button class="nbtn" style="font-size:11px" onclick="loadGcalEvents()">actualizar</button>
    </div>`;
  }else{
    bar.innerHTML='';
  }
}

function signIn(){
  if(tokenClient) tokenClient.requestAccessToken();
}

function signOut(){
  if(accessToken) google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken=null;userInfo=null;gcalEvs=[];
  renderAuthArea();
  renderTimeline();
  showToast('Sesión de Google cerrada');
}

async function fetchUserInfo(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+accessToken}});
    userInfo=await r.json();
    renderAuthArea();
  }catch(e){}
}

async function loadGcalEvents(){
  if(!accessToken)return;
  try{
    const dateStr=fd(cur);
    const tMin=dateStr+'T00:00:00Z',tMax=dateStr+'T23:59:59Z';
    const url=`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});
    const data=await r.json();
    gcalEvs=(data.items||[]).map(e=>({
      id:'g_'+e.id,
      gcalId:e.id,
      title:e.summary||'(sin título)',
      start:e.start.dateTime?e.start.dateTime.substring(11,16):'00:00',
      end:e.end.dateTime?e.end.dateTime.substring(11,16):'00:00',
      date:dateStr,
      src:'gcal'
    }));
    renderGcalBar(true);
    renderTimeline();
    showToast(gcalEvs.length+' eventos de Google Calendar cargados');
  }catch(e){showToast('Error al cargar Google Calendar');}
}

async function createGcalEvent(title,date,start,end){
  if(!accessToken)return null;
  try{
    const body={
      summary:title,
      start:{dateTime:date+'T'+start+':00',timeZone:'America/Bogota'},
      end:{dateTime:date+'T'+end+':00',timeZone:'America/Bogota'}
    };
    const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{
      method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const ev=await r.json();
    showToast('Evento creado en Google Calendar');
    return ev.id;
  }catch(e){showToast('Error al crear en Google Calendar');return null;}
}

async function deleteGcalEvent(gcalId){
  if(!accessToken||!gcalId)return;
  try{
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalId}`,{
      method:'DELETE',headers:{Authorization:'Bearer '+accessToken}
    });
    showToast('Evento eliminado de Google Calendar');
  }catch(e){}
}

function chDay(d){
  if(d===0)cur=new Date();
  else{cur=new Date(cur);cur.setDate(cur.getDate()+d);}
  gcalEvs=[];
  renderAll();
  if(accessToken) loadGcalEvents();
}

function renderAll(){renderLabel();renderTimeline();renderTasks();renderNotes();renderStats();}

function renderLabel(){
  const isT=fd(cur)===fd(new Date());
  const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('dlabel').textContent=(isT?'hoy — ':'')+days[cur.getDay()]+' '+cur.getDate()+' de '+months[cur.getMonth()]+' '+cur.getFullYear();
}

function renderTimeline(){
  const tl=document.getElementById('timeline');
  const ds=fd(cur),evs=[...D.events.filter(e=>e.date===ds),...gcalEvs];
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),isT=fd(cur)===fd(now);
  let html='';
  for(let h=6;h<=22;h++){
    const hs=h*60,he=(h+1)*60;
    const ehtml=evs.filter(e=>pt(e.start)>=hs&&pt(e.start)<he).map(e=>`
      <div class="ev ${e.src}" onclick="editEv('${e.id}','${e.src}')">
        <div class="ev-t">${e.title}</div>
        <div class="ev-s">${e.start}${e.end?' — '+e.end:''}</div>
      </div>`).join('');
    const pct=isT&&nm>=hs&&nm<he?((nm-hs)/60*56)+8:null;
    const nl=pct!==null?`<div class="now-line" style="top:${Math.round(pct)}px"><div class="now-dot"></div></div>`:'';
    html+=`<div class="hrow"><div class="hlbl">${String(h).padStart(2,'0')}:00</div><div class="hcnt">${nl}${ehtml}</div></div>`;
  }
  tl.innerHTML=html;
  if(isT){const rows=tl.querySelectorAll('.hrow');const i=Math.max(0,now.getHours()-6);if(rows[i])rows[i].scrollIntoView({block:'center'});}
}

function renderStats(){
  const a=D.tasks.filter(t=>!t.done);
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n" style="color:#f09595">${a.filter(t=>t.pri==='alta').length}</div><div class="stat-l">alta</div></div>
    <div class="stat"><div class="stat-n" style="color:#fac775">${a.filter(t=>t.pri==='media').length}</div><div class="stat-l">media</div></div>
    <div class="stat"><div class="stat-n" style="color:#c0dd97">${a.filter(t=>t.pri==='baja').length}</div><div class="stat-l">baja</div></div>`;
}

function renderTasks(){
  const ord={alta:0,media:1,baja:2};
  const active=[...D.tasks].filter(t=>!t.done).sort((a,b)=>ord[a.pri]-ord[b.pri]);
  const done=D.tasks.filter(t=>t.done);
  document.getElementById('tasks-active').innerHTML=active.map(t=>`
    <div class="task-item" id="ti${t.id}">
      <div class="chk" onclick="chkTask(${t.id})"></div>
      <div class="ttxt">${t.text}</div>
      <span class="pbadge p-${t.pri}">${t.pri}</span>
    </div>`).join('');
  document.getElementById('tasks-done').innerHTML=done.map(t=>`
    <div class="task-item">
      <div class="chk done">&#10003;</div>
      <div class="ttxt done">${t.text}</div>
      <span class="pbadge p-${t.pri}">${t.pri}</span>
    </div>`).join('');
  document.getElementById('done-lbl').textContent=`finalizadas (${done.length})`;
  const body=document.getElementById('done-body'),arrow=document.getElementById('done-arrow');
  doneOpen?body.classList.add('open'):body.classList.remove('open');
  doneOpen?arrow.classList.add('open'):arrow.classList.remove('open');
}

function chkTask(id){
  const el=document.getElementById('ti'+id);
  if(el)el.classList.add('out');
  setTimeout(()=>{const t=D.tasks.find(x=>x.id===id);if(t)t.done=true;save();renderTasks();renderStats();},380);
}

function toggleDone(){
  doneOpen=!doneOpen;
  const body=document.getElementById('done-body'),arrow=document.getElementById('done-arrow');
  doneOpen?body.classList.add('open'):body.classList.remove('open');
  doneOpen?arrow.classList.add('open'):arrow.classList.remove('open');
}

function renderNotes(){
  document.getElementById('postits').innerHTML=D.notes.map(n=>`
    <div class="pit ${n.color}" onclick="openNoteModal(${n.id})">
      <button class="pit-x" onclick="event.stopPropagation();delNote(${n.id})">&#10005;</button>
      ${n.text}
    </div>`).join('');
}

function showModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}

function openEvModal(ev){
  const e=ev||{},isE=!!e.id&&e.src==='local';
  const syncCheck=accessToken?`<label style="display:flex;align-items:center;gap:6px;margin-top:12px;cursor:pointer">
    <input type="checkbox" id="esync" ${!isE?'checked':''} style="width:14px;height:14px">
    <span style="font-size:12px;color:var(--t1)">También crear en Google Calendar</span>
  </label>`:'';
  showModal(`<h3>${isE?'editar evento':'nuevo evento'}</h3>
    <label>título</label><input id="et" value="${e.title||''}" placeholder="Reunión...">
    <label>fecha</label><input id="ed" type="date" value="${e.date||fd(cur)}">
    <label>inicio</label><input id="es" type="time" value="${e.start||'09:00'}">
    <label>fin</label><input id="ee" type="time" value="${e.end||'10:00'}">
    ${syncCheck}
    <div class="mbtns">
      ${isE?`<button class="mdel" onclick="delEv(${e.id})">eliminar</button>`:''}
      <button onclick="closeModal()">cancelar</button>
      <button class="mpri" onclick="saveEv(${isE?e.id:'null'})">guardar</button>
    </div>`);
}

async function saveEv(id){
  const t=document.getElementById('et').value.trim(),d=document.getElementById('ed').value;
  const s=document.getElementById('es').value,en=document.getElementById('ee').value;
  const sync=document.getElementById('esync');
  if(!t||!d||!s)return;
  if(id&&id!=='null'){
    const ev=D.events.find(e=>e.id===id);
    if(ev){ev.title=t;ev.date=d;ev.start=s;ev.end=en;}
  }else{
    D.events.push({id:++evId,title:t,date:d,start:s,end:en,src:'local'});
  }
  save();closeModal();renderTimeline();
  if(sync&&sync.checked&&accessToken){
    await createGcalEvent(t,d,s,en);
    if(fd(cur)===d) loadGcalEvents();
  }
}

function editEv(id,src){
  if(src==='gcal'){showToast('Los eventos de Google Calendar se editan en calendar.google.com');return;}
  const ev=D.events.find(e=>e.id==id);
  if(ev)openEvModal(ev);
}

async function delEv(id){
  const ev=D.events.find(e=>e.id===id);
  if(ev&&ev.gcalId&&accessToken) await deleteGcalEvent(ev.gcalId);
  D.events=D.events.filter(e=>e.id!==id);
  save();closeModal();renderTimeline();
}

function openTaskModal(){
  showModal(`<h3>nueva tarea</h3>
    <label>tarea</label><input id="tt" placeholder="Descripción...">
    <label>prioridad</label>
    <select id="tp"><option value="alta">alta</option><option value="media" selected>media</option><option value="baja">baja</option></select>
    <div class="mbtns">
      <button onclick="closeModal()">cancelar</button>
      <button class="mpri" onclick="saveTask()">agregar</button>
    </div>`);
}
function saveTask(){
  const t=document.getElementById('tt').value.trim(),p=document.getElementById('tp').value;
  if(!t)return;
  D.tasks.push({id:++tId,text:t,done:false,pri:p});
  save();closeModal();renderTasks();renderStats();
}

function openNoteModal(id){
  const n=id?D.notes.find(x=>x.id===id):null;
  selC=n?n.color:'y';
  showModal(`<h3>${n?'editar nota':'nueva nota post-it'}</h3>
    <label>color</label>
    <div class="crow">
      <div class="cdot${selC==='y'?' sel':''}" id="cy" style="background:#2a2410" onclick="pickC('y')"></div>
      <div class="cdot${selC==='g'?' sel':''}" id="cg" style="background:#152410" onclick="pickC('g')"></div>
      <div class="cdot${selC==='b'?' sel':''}" id="cb" style="background:#0d1e35" onclick="pickC('b')"></div>
      <div class="cdot${selC==='p'?' sel':''}" id="cp" style="background:#1e1535" onclick="pickC('p')"></div>
    </div>
    <label>nota</label>
    <textarea id="nt">${n?n.text:''}</textarea>
    <div class="mbtns">
      ${n?`<button class="mdel" onclick="delNote(${id})">eliminar</button>`:''}
      <button onclick="closeModal()">cancelar</button>
      <button class="mpri" onclick="saveNote(${n?id:'null'})">guardar</button>
    </div>`);
}
function pickC(c){
  selC=c;
  ['y','g','b','p'].forEach(x=>{const el=document.getElementById('c'+x);if(el){el.className='cdot'+(x===c?' sel':'');}});
}
function saveNote(id){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  if(id&&id!=='null'){const n=D.notes.find(x=>x.id===id);if(n){n.text=t;n.color=selC;}}
  else D.notes.push({id:++nId,text:t,color:selC});
  save();closeModal();renderNotes();
}
function delNote(id){D.notes=D.notes.filter(n=>n.id!==id);save();closeModal();renderNotes();}

window.addEventListener('load',()=>{
  initGoogleAuth();
  renderAll();
});
</script>
</body>
</html>
